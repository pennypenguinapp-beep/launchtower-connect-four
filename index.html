<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Connect Four — LaunchTower</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1d2029;
    --panel2: #232734;
    --line: #2e3342;
    --text: #e8eaf0;
    --muted: #8b93a7;
    --red: #ff5a5f;
    --yellow: #ffd23f;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    width: 100%;
    max-width: 560px;
    padding: 14px 16px 6px;
    text-align: center;
  }
  header h1 {
    font-size: 1.35rem;
    letter-spacing: 0.06em;
    font-weight: 700;
  }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }

  .controls {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 10px 16px;
  }
  .controls select, .controls button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    outline: none;
  }
  .controls select:focus, .controls button:focus { border-color: var(--accent); }
  .controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .scoreboard {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding: 0 16px 4px;
    width: 100%;
    max-width: 560px;
  }
  .score {
    flex: 1;
    max-width: 150px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
    transition: border-color .2s, box-shadow .2s;
  }
  .score .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  .score .num { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }
  .score.red.active { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
  .score.yellow.active { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow); }
  .score .num.red { color: var(--red); }
  .score .num.yellow { color: var(--yellow); }
  .score.draw .num { color: var(--muted); }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    padding: 6px 12px 10px;
    display: flex;
    justify-content: center;
  }
  canvas {
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
    border-radius: 12px;
    touch-action: manipulation;
  }

  .status {
    text-align: center;
    font-size: 0.95rem;
    min-height: 1.4em;
    padding: 0 16px 4px;
    color: var(--muted);
  }
  .status b.red { color: var(--red); }
  .status b.yellow { color: var(--yellow); }

  footer {
    margin-top: auto;
    padding: 14px 0 18px;
    text-align: center;
  }
  footer a {
    color: var(--muted);
    font-size: 0.78rem;
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
  footer a:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>CONNECT <span>FOUR</span></h1>
  <p>Drop discs, line up four. Beat the AI or a friend.</p>
</header>

<div class="controls">
  <select id="mode" aria-label="Game mode">
    <option value="ai">1P vs AI</option>
    <option value="2p">2P Local</option>
  </select>
  <select id="depth" aria-label="AI difficulty">
    <option value="2">AI: Easy</option>
    <option value="4" selected>AI: Normal</option>
    <option value="6">AI: Hard</option>
  </select>
  <button id="newGame" class="primary">New Game</button>
</div>

<div class="scoreboard">
  <div class="score red" id="scoreRed">
    <div class="label" id="redLabel">Red</div>
    <div class="num red" id="redScore">0</div>
  </div>
  <div class="score draw">
    <div class="label">Draws</div>
    <div class="num" id="drawScore">0</div>
  </div>
  <div class="score yellow" id="scoreYellow">
    <div class="label" id="yellowLabel">Yellow</div>
    <div class="num yellow" id="yellowScore">0</div>
  </div>
</div>

<div class="board-wrap">
  <canvas id="board" width="520" height="620" aria-label="Connect Four board"></canvas>
</div>

<div class="status" id="status">Red to move — tap a column</div>

<footer>
  <a href="https://pennypenguinapp-beep.github.io/" target="_blank" rel="noopener">More free games &amp; tools by LaunchTower</a>
</footer>

<script>
(function () {
  "use strict";

  var ROWS = 6, COLS = 7, WIN = 4;
  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");

  var modeSel = document.getElementById("mode");
  var depthSel = document.getElementById("depth");
  var newBtn = document.getElementById("newGame");
  var statusEl = document.getElementById("status");
  var redScoreEl = document.getElementById("redScore");
  var yellowScoreEl = document.getElementById("yellowScore");
  var drawScoreEl = document.getElementById("drawScore");
  var redLabel = document.getElementById("redLabel");
  var yellowLabel = document.getElementById("yellowLabel");
  var scoreRedBox = document.getElementById("scoreRed");
  var scoreYellowBox = document.getElementById("scoreYellow");

  var board, current, gameOver, winCells, scores;
  var aiColor = 2; // AI always plays yellow in 1P mode

  // ---- layout geometry (CSS pixels, canvas is 520x620) ----
  var cell, padX, padTop, boardW, boardH, holeR;

  function computeLayout() {
    cell = 64;
    padX = 20;
    padTop = 40;
    boardW = COLS * cell;
    boardH = ROWS * cell;
    holeR = cell * 0.36;
  }
  computeLayout();

  function reset() {
    board = [];
    for (var r = 0; r < ROWS; r++) {
      board.push(new Array(COLS).fill(0));
    }
    current = 1;
    gameOver = false;
    winCells = null;
    updateStatus();
    draw();
  }

  function newGame() {
    reset();
  }

  function updateLabels() {
    var ai = modeSel.value === "ai";
    redLabel.textContent = "Red" + (ai ? " (You)" : "");
    yellowLabel.textContent = "Yellow" + (ai ? " (AI)" : "");
  }

  function updateStatus() {
    if (gameOver) return;
    var name = current === 1 ? "Red" : "Yellow";
    var who = (modeSel.value === "ai" && current === aiColor) ? "AI is thinking…" : name + " to move — tap a column";
    statusEl.innerHTML = "<b class='" + (current === 1 ? "red" : "yellow") + "'>" + name + "</b> to move — tap a column";
  }

  function setStatus(html) { statusEl.innerHTML = html; }

  // ---- game rules ----
  function validCol(c) {
    return c >= 0 && c < COLS && board[0][c] === 0;
  }

  function drop(c) {
    for (var r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] === 0) { board[r][c] = current; return r; }
    }
    return -1;
  }

  function checkWin(c) {
    var p = board[0][c] === 0 ? null : null;
    // find the player who just moved: current is already switched, so use the last mover
    var mover = lastMover;
    var dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (var d = 0; d < dirs.length; d++) {
      var dr = dirs[d][0], dc = dirs[d][1];
      var cells = [[c, lastRow]];
      // forward
      var r = lastRow + dr, cc = c + dc;
      while (r >= 0 && r < ROWS && cc >= 0 && cc < COLS && board[r][cc] === mover) {
        cells.push([cc, r]); r += dr; cc += dc;
      }
      // backward
      r = lastRow - dr; cc = c - dc;
      while (r >= 0 && r < ROWS && cc >= 0 && cc < COLS && board[r][cc] === mover) {
        cells.push([cc, r]); r -= dr; cc -= dc;
      }
      if (cells.length >= WIN) return cells;
    }
    return null;
  }

  var lastMover = 1, lastRow = 0;

  function isFull() {
    for (var c = 0; c < COLS; c++) if (board[0][c] === 0) return false;
    return true;
  }

  function onMove(col) {
    if (gameOver) return;
    if (!validCol(col)) return;
    lastMover = current;
    lastRow = drop(col);
    var win = checkWin(col);
    if (win) {
      gameOver = true;
      winCells = win;
      if (lastMover === 1) scores.red++; else scores.yellow++;
      updateScores();
      var name = lastMover === 1 ? "Red" : "Yellow";
      setStatus("<b class='" + (lastMover === 1 ? "red" : "yellow") + "'>" + name + " wins!</b> — tap New Game to play again");
      draw();
      return;
    }
    if (isFull()) {
      gameOver = true;
      scores.draw++;
      updateScores();
      setStatus("Draw — board is full. Tap New Game to play again");
      draw();
      return;
    }
    current = current === 1 ? 2 : 1;
    updateStatus();
    draw();
    if (modeSel.value === "ai" && current === aiColor) {
      setTimeout(aiMove, 350);
    }
  }

  function updateScores() {
    redScoreEl.textContent = scores.red;
    yellowScoreEl.textContent = scores.yellow;
    drawScoreEl.textContent = scores.draw;
  }

  // ---- AI: minimax with alpha-beta ----
  function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

  function winsAt(b, r, c, p) {
    var dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for (var d = 0; d < 4; d++) {
      var dr = dirs[d][0], dc = dirs[d][1];
      var count = 1;
      var rr = r + dr, cc = c + dc;
      while (inBounds(rr, cc) && b[rr][cc] === p) { count++; rr += dr; cc += dc; }
      rr = r - dr; cc = c - dc;
      while (inBounds(rr, cc) && b[rr][cc] === p) { count++; rr -= dr; cc -= dc; }
      if (count >= WIN) return true;
    }
    return false;
  }

  function winner(b) {
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        if (b[r][c] !== 0 && winsAt(b, r, c, b[r][c])) return b[r][c];
    return 0;
  }

  function legalCols(b) {
    var cols = [];
    for (var c = 0; c < COLS; c++) if (b[0][c] === 0) cols.push(c);
    return cols;
  }

  function dropIn(b, c, p) {
    for (var r = ROWS - 1; r >= 0; r--) {
      if (b[r][c] === 0) { b[r][c] = p; return r; }
    }
    return -1;
  }

  function scoreWindow(w, p) {
    var opp = p === 1 ? 2 : 1;
    var mine = 0, theirs = 0, empty = 0;
    for (var i = 0; i < 4; i++) {
      if (w[i] === p) mine++;
      else if (w[i] === opp) theirs++;
      else empty++;
    }
    if (mine === 4) return 100000;
    if (mine === 3 && empty === 1) return 120;
    if (mine === 2 && empty === 2) return 12;
    if (theirs === 3 && empty === 1) return -110;
    if (theirs === 2 && empty === 2) return -10;
    return 0;
  }

  function evaluate(b, p) {
    var score = 0;
    // center preference
    for (var r = 0; r < ROWS; r++) if (b[r][3] === p) score += 6;
    for (var row = 0; row < ROWS; row++)
      for (var col = 0; col < COLS - 3; col++)
        score += scoreWindow([b[row][col], b[row][col+1], b[row][col+2], b[row][col+3]], p);
    for (var c2 = 0; c2 < COLS; c2++)
      for (var r2 = 0; r2 < ROWS - 3; r2++)
        score += scoreWindow([b[r2][c2], b[r2+1][c2], b[r2+2][c2], b[r2+3][c2]], p);
    for (var r3 = 0; r3 < ROWS - 3; r3++)
      for (var c3 = 0; c3 < COLS - 3; c3++)
        score += scoreWindow([b[r3][c3], b[r3+1][c3+1], b[r3+2][c3+2], b[r3+3][c3+3]], p);
    for (var r4 = 3; r4 < ROWS; r4++)
      for (var c4 = 0; c4 < COLS - 3; c4++)
        score += scoreWindow([b[r4][c4], b[r4-1][c4+1], b[r4-2][c4+2], b[r4-3][c4+3]], p);
    return score;
  }

  function minimax(b, depth, alpha, beta, maximizing, p) {
    var w = winner(b);
    if (w === p) return 1000000 + depth;
    if (w !== 0) return -1000000 - depth;
    if (depth === 0) return evaluate(b, p);
    var cols = legalCols(b);
    if (cols.length === 0) return 0;
    // center-first ordering
    cols.sort(function (a, b2) { return Math.abs(3 - a) - Math.abs(3 - b2); });
    if (maximizing) {
      var best = -Infinity;
      for (var i = 0; i < cols.length; i++) {
        var c = cols[i];
        dropIn(b, c, p);
        var val = minimax(b, depth - 1, alpha, beta, false, p);
        b[findRow(b, c)][c] = 0;
        best = Math.max(best, val);
        alpha = Math.max(alpha, val);
        if (alpha >= beta) break;
      }
      return best;
    } else {
      var opp = p === 1 ? 2 : 1;
      var worst = Infinity;
      for (var j = 0; j < cols.length; j++) {
        var c2 = cols[j];
        dropIn(b, c2, opp);
        var val2 = minimax(b, depth - 1, alpha, beta, true, p);
        b[findRow(b, c2)][c2] = 0;
        worst = Math.min(worst, val2);
        beta = Math.min(beta, val2);
        if (alpha >= beta) break;
      }
      return worst;
    }
  }

  function findRow(b, c) {
    for (var r = ROWS - 1; r >= 0; r--) if (b[r][c] !== 0) return r;
    return -1;
  }

  function aiMove() {
    if (gameOver || modeSel.value !== "ai" || current !== aiColor) return;
    var depth = parseInt(depthSel.value, 10) || 4;
    var cols = legalCols(board);
    if (cols.length === 0) return;
    cols.sort(function (a, b) { return Math.abs(3 - a) - Math.abs(3 - b); });
    var bestScore = -Infinity, bestCol = cols[0];
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i];
      dropIn(board, c, aiColor);
      var s = minimax(board, depth - 1, -Infinity, Infinity, false, aiColor);
      board[findRow(board, c)][c] = 0;
      if (s > bestScore) { bestScore = s; bestCol = c; }
    }
    onMove(bestCol);
  }

  // ---- rendering ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // board background
    ctx.fillStyle = "#2a3550";
    roundRect(padX - 8, padTop - 8, boardW + 16, boardH + 16, 14);
    ctx.fill();
    ctx.strokeStyle = "#3b4a70";
    ctx.lineWidth = 2;
    ctx.stroke();

    // holes + discs
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cx = padX + c * cell + cell / 2;
        var cy = padTop + r * cell + cell / 2;
        // hole
        ctx.beginPath();
        ctx.arc(cx, cy, holeR, 0, Math.PI * 2);
        ctx.fillStyle = "#171a22";
        ctx.fill();

        var val = board[r][c];
        if (val !== 0) {
          var isWin = winCells && winCells.some(function (cellArr) { return cellArr[0] === c && cellArr[1] === r; });
          ctx.beginPath();
          ctx.arc(cx, cy, holeR - 2, 0, Math.PI * 2);
          ctx.fillStyle = val === 1 ? "#ff5a5f" : "#ffd23f";
          ctx.fill();
          // inner shading
          ctx.beginPath();
          ctx.arc(cx - holeR * 0.25, cy - holeR * 0.25, holeR * 0.55, 0, Math.PI * 2);
          ctx.fillStyle = val === 1 ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.28)";
          ctx.fill();
          if (isWin) {
            ctx.beginPath();
            ctx.arc(cx, cy, holeR - 2, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.stroke();
          }
        }
      }
    }

    // turn indicator above the board
    if (!gameOver) {
      var ix = padX + 3 * cell + cell / 2;
      var iy = padTop - 20;
      ctx.beginPath();
      ctx.arc(ix, iy, 9, 0, Math.PI * 2);
      ctx.fillStyle = current === 1 ? "#ff5a5f" : "#ffd23f";
      ctx.fill();
    }
  }

  // ---- input ----
  function colFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var x = (e.clientX - rect.left) * scaleX;
    var c = Math.floor((x - padX) / cell);
    if (c < 0 || c >= COLS) return -1;
    return c;
  }

  canvas.addEventListener("click", function (e) {
    if (gameOver) return;
    if (modeSel.value === "ai" && current === aiColor) return;
    var c = colFromEvent(e);
    if (c >= 0) onMove(c);
  });

  canvas.addEventListener("touchstart", function (e) {
    if (gameOver) return;
    if (modeSel.value === "ai" && current === aiColor) return;
    if (e.touches.length !== 1) return;
    e.preventDefault();
    var t = e.touches[0];
    var c = colFromEvent(t);
    if (c >= 0) onMove(c);
  }, { passive: false });

  newBtn.addEventListener("click", function () {
    scores = { red: scores.red, yellow: scores.yellow, draw: scores.draw };
    reset();
  });

  modeSel.addEventListener("change", function () {
    updateLabels();
    scores = { red: 0, yellow: 0, draw: 0 };
    updateScores();
    reset();
  });

  // ---- init ----
  scores = { red: 0, yellow: 0, draw: 0 };
  updateLabels();
  updateScores();
  reset();
})();
</script>
</body>
</html>
